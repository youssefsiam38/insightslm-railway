# Local test topology. Mirrors the Railway service graph one-to-one: the same nine services, the same names,
# one volume per stateful service, and every value Railway passes as a variable reference written out here.
# Wrapper images are built from this repository; CI and the Railway template use the published GHCR images.
#
#   db         Supabase Postgres          wrapper    volume
#   auth       Supabase Auth (GoTrue)     upstream
#   rest       PostgREST                  upstream
#   realtime   Supabase Realtime          upstream
#   storage    Supabase Storage           wrapper    volume
#   kong       API gateway                wrapper    public
#   functions  Supabase Edge Functions    built here
#   n8n        n8n (workflows)            upstream, unmodified
#   app        InsightsLM web app         built here public
#
# plus a test-only stand-in for OpenAI, Gemini and Jina (mock-ai), which the deployment's model settings point at.
#
# Every secret below is a fixed, public, local-test-only value. The Railway template generates real ones. The
# browser and the containers must reach the gateway at the same URL, so Kong listens on the same port inside as
# it is published on, under a network alias that also resolves on the host. Ports move with
# INSIGHTSLM_TEST_GATEWAY_PORT and INSIGHTSLM_TEST_PORT.
name: insightslm-railway-test

x-wrapper-build: &wrapper-build
  context: .
  args:
    WRAPPER_VERSION: ${WRAPPER_VERSION:-0.0.0-local}
    VCS_REF: ${VCS_REF:-local}

x-secrets:
  postgres-password: &postgres-password localtestonlypostgrespassword0000000000000000
  jwt-secret: &jwt-secret local-test-only-jwt-secret-000000000000000000000000000000
  webhook-auth: &webhook-auth local-test-only-webhook-auth-000000000000000000

services:
  db:
    build: { <<: *wrapper-build, dockerfile: images/db/Dockerfile }
    image: ${INSIGHTSLM_RAILWAY_DB_IMAGE:-insightslm-railway-db:local}
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: *postgres-password
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 60

  auth:
    image: docker.io/supabase/gotrue:v2.197.0@sha256:1736a63078f5922b198c4cbe50f80ab9a2d3b54fe8b7b6cfb2e9dc5dbbc12c6b
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      GOTRUE_API_HOST: "::"
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://kong.localhost:${INSIGHTSLM_TEST_GATEWAY_PORT:-18600}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:localtestonlypostgrespassword0000000000000000@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:${INSIGHTSLM_TEST_PORT:-13600}
      GOTRUE_URI_ALLOW_LIST: http://localhost:${INSIGHTSLM_TEST_PORT:-13600}/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: *jwt-secret
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"

  rest:
    image: docker.io/postgrest/postgrest:v14.17@sha256:c9dc201e555f5d8e37e7f39cdd4df0229774996e213bfd7de8d10ac609030f2c
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      PGRST_DB_URI: postgres://authenticator:localtestonlypostgrespassword0000000000000000@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: *jwt-secret
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: "3600"
      PGRST_SERVER_HOST: "*6"
      PGRST_SERVER_PORT: "3000"

  realtime:
    image: docker.io/supabase/realtime:v2.134.10@sha256:cbcc6a7986fc28b6dcffa798b077d5fb9c69cd25500371ab49147a86d7edbb03
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      PORT: "4000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: supabase_admin
      DB_PASSWORD: *postgres-password
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: localtestonly000
      API_JWT_SECRET: *jwt-secret
      METRICS_JWT_SECRET: *jwt-secret
      SECRET_KEY_BASE: localtestonlysecretkeybase00000000000000000000000000000000000000000000
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      SELF_HOST_TENANT_NAME: realtime
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"

  storage:
    build: { <<: *wrapper-build, dockerfile: images/storage/Dockerfile }
    image: ${INSIGHTSLM_RAILWAY_STORAGE_IMAGE:-insightslm-railway-storage:local}
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      JWT_SECRET: *jwt-secret
      DATABASE_URL: postgres://supabase_storage_admin:localtestonlypostgrespassword0000000000000000@db:5432/postgres
      POSTGREST_URL: http://rest:3000
      STORAGE_PUBLIC_URL: http://kong.localhost:${INSIGHTSLM_TEST_GATEWAY_PORT:-18600}
    volumes:
      - storage:/var/lib/storage

  functions:
    build: { <<: *wrapper-build, dockerfile: images/functions/Dockerfile }
    image: ${INSIGHTSLM_RAILWAY_FUNCTIONS_IMAGE:-insightslm-railway-functions:local}
    restart: unless-stopped
    environment:
      PORT: "9000"
      JWT_SECRET: *jwt-secret
      SUPABASE_URL: http://kong.localhost:${INSIGHTSLM_TEST_GATEWAY_PORT:-18600}
      NOTEBOOK_GENERATION_AUTH: *webhook-auth
      NOTEBOOK_CHAT_URL: http://n8n:5678/webhook/2fabf43f-6e6e-424b-8e93-9150e9ce7d6c
      NOTEBOOK_GENERATION_URL: http://n8n:5678/webhook/0c488f50-8d6a-48a0-b056-5f7cfca9efe2
      AUDIO_GENERATION_WEBHOOK_URL: http://n8n:5678/webhook/4c4699bc-004b-4ca3-8923-373ddd4a274e
      ADDITIONAL_SOURCES_WEBHOOK_URL: http://n8n:5678/webhook/670882ea-5c1e-4b50-9f41-4792256af985
      DOCUMENT_PROCESSING_WEBHOOK_URL: http://n8n:5678/webhook/19566c6c-e0a5-4a8f-ba1a-5203c2b663b7
      OPENAI_API_KEY: ${INSIGHTSLM_TEST_OPENAI_KEY:-mock-openai-key}
      OPENAI_BASE_URL: ${INSIGHTSLM_TEST_OPENAI_URL:-http://mock-ai:8000/v1}

  kong:
    build: { <<: *wrapper-build, dockerfile: images/kong/Dockerfile }
    image: ${INSIGHTSLM_RAILWAY_KONG_IMAGE:-insightslm-railway-kong:local}
    restart: unless-stopped
    depends_on: [auth, rest, realtime, storage, functions]
    environment:
      PORT: ${INSIGHTSLM_TEST_GATEWAY_PORT:-18600}
      JWT_SECRET: *jwt-secret
      AUTH_HOST: auth
      REST_HOST: rest
      REALTIME_HOST: realtime
      STORAGE_HOST: storage
      FUNCTIONS_HOST: functions
    ports: ["127.0.0.1:${INSIGHTSLM_TEST_GATEWAY_PORT:-18600}:${INSIGHTSLM_TEST_GATEWAY_PORT:-18600}"]
    networks:
      default:
        aliases: [kong.localhost]

  # n8n's official image, configured only through variables, exactly as the template runs it.
  n8n:
    image: docker.io/n8nio/n8n:2.39.6@sha256:1eb33706d9bd902cc83f302ba8d608420dfc0815e03ee4bb1c072367d2c5e259
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      N8N_PORT: "5678"
      N8N_LISTEN_ADDRESS: "::"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: postgres
      DB_POSTGRESDB_PASSWORD: *postgres-password
      N8N_ENCRYPTION_KEY: local-test-only-n8n-encryption-key-0000000000
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_DEFAULT_BINARY_DATA_MODE: default
      N8N_RUNNERS_ENABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      GENERIC_TIMEZONE: UTC

  # Test-only stand-in for OpenAI, Gemini and Jina; never part of the template.
  mock-ai:
    image: docker.io/library/python:3.13-alpine@sha256:7415fbc3c9e4979cc717d92377ab2bc7b2b4a2af1ac03cc52b5f3f88efedaf3a
    command: ["python", "/mock-ai.py"]
    volumes: ["./tests/mock-ai.py:/mock-ai.py:ro"]

  app:
    build: { <<: *wrapper-build, dockerfile: images/app/Dockerfile }
    image: ${INSIGHTSLM_RAILWAY_APP_IMAGE:-insightslm-railway-app:local}
    restart: unless-stopped
    depends_on: [kong, n8n, functions]
    environment:
      PORT: "3000"
      JWT_SECRET: *jwt-secret
      SUPABASE_DB_URL: postgres://postgres:localtestonlypostgrespassword0000000000000000@db:5432/postgres
      SUPABASE_INTERNAL_URL: http://kong:${INSIGHTSLM_TEST_GATEWAY_PORT:-18600}
      SUPABASE_PUBLIC_URL: http://kong.localhost:${INSIGHTSLM_TEST_GATEWAY_PORT:-18600}
      FUNCTIONS_INTERNAL_URL: http://functions:9000
      N8N_INTERNAL_URL: http://n8n:5678
      NOTEBOOK_GENERATION_AUTH: *webhook-auth
      OWNER_EMAIL: owner@example.com
      OWNER_PASSWORD: local-test-only-owner-password
      N8N_OWNER_PASSWORD: LocalTestOnlyN8nOwner1
      INSIGHTSLM_SIGNUP_MODE: closed
      INSIGHTSLM_ALLOWED_SIGNUPS: ${INSIGHTSLM_TEST_ALLOWED_SIGNUPS:-friend@example.com}
      INSIGHTSLM_RESET_OWNER_PASSWORD: ${INSIGHTSLM_TEST_RESET_OWNER:-}
      OPENAI_API_KEY: ${INSIGHTSLM_TEST_OPENAI_KEY:-mock-openai-key}
      OPENAI_BASE_URL: ${INSIGHTSLM_TEST_OPENAI_URL:-http://mock-ai:8000/v1}
      GEMINI_API_KEY: ${INSIGHTSLM_TEST_GEMINI_KEY:-mock-gemini-key}
      GEMINI_BASE_URL: ${INSIGHTSLM_TEST_GEMINI_URL:-http://mock-ai:8000}
      READER_BASE_URL: ${INSIGHTSLM_TEST_READER_URL:-http://mock-ai:8000/reader}
    ports: ["127.0.0.1:${INSIGHTSLM_TEST_PORT:-13600}:3000"]

networks:
  default:
    enable_ipv6: true

volumes:
  db:
  storage:
